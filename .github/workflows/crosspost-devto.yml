# Cross-posts a single blog article to dev.to with a canonical URL pointing
# back to sproutern.dpdns.org (SEO credit stays home).
# DORMANT until the free secret exists: dev.to → Settings → Extensions →
# "DEV Community API Keys" → add repo secret DEVTO_API_KEY.
# Run: Actions → Cross-post to dev.to → Run workflow → give the markdown path.
name: Cross-post to dev.to

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Path to the markdown post (relative to repo root)'
        required: true
        default: 'docs/blog-drafts/latest.md'

permissions:
  contents: read

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # NOTE: `secrets` is not usable in `if:` expressions — the guard lives
      # in the shell instead so the workflow itself stays green when dormant.
      - name: Publish to dev.to (no-op without DEVTO_API_KEY)
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          POST_FILE: ${{ inputs.file }}
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "::notice::DEVTO_API_KEY not set — get a free key at https://dev.to/settings/extensions and add it as a repo secret. Nothing to do."
            exit 0
          fi
          npx tsx scripts/crosspost-devto.ts "$POST_FILE"
